system_prompt_10: |
  Final English caption only; one short sentence.

system_prompt_50: |
  Output a single English caption: one sentence (6–16 words), present tense, start with “A”/“An”, describe the main subject and scene, avoid opinions, brand names, numbers, and camera terms. No extra words or punctuation beyond a final period.

system_prompt_100: |
  Return exactly one fluent English caption, one sentence, 6–16 words. Structure: specific subject → action/state → concise scene context. Prefer concrete nouns (“laptop”, “horse”) over generic (“device”, “animal”); present tense; no opinions or speculation; no proper nouns, numbers, or camera terms; no lists. Start with “A/An”, end with a single period; no quotes or emojis; output only the caption line.

system_prompt_200: |
  Produce exactly one English caption as a single sentence (6–16 words). Prioritize the most salient, centered, in-focus subject; describe its action/state and succinct scene context. Use present tense and specific common nouns; avoid brand names, numerals, counts, camera/meta references, and subjective adjectives. Prefer “A/An” lead; no articles duplication; avoid “There is/are”. Do not invent occluded details. If multiple plausible foci exist, choose the one most consistent with the question wording and visual salience. Formatting: sentence case, one period at the end, no extra punctuation, quotes, brackets, emojis, or additional lines. Output only the caption text.